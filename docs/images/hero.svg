<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2370"/>
      <stop offset="0.55" stop-color="#1b1f4e"/>
      <stop offset="1" stop-color="#0f3a4f"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset="0.45" stop-color="#6fb4ff"/>
      <stop offset="1" stop-color="#6ff0ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#7fe9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fe9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="480" rx="28" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <path d="M1116 92 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z" opacity="0.9"/>
    <path d="M770 70 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" opacity="0.7"/>
    <circle cx="1210" cy="380" r="2" opacity="0.6"/>
    <circle cx="700" cy="400" r="1.6" opacity="0.5"/>
    <circle cx="1040" cy="420" r="1.8" opacity="0.5"/>
    <circle cx="860" cy="140" r="1.4" opacity="0.6"/>
  </g>

  <!-- portal arch -->
  <ellipse cx="960" cy="260" rx="190" ry="190" fill="url(#glow)"/>
  <path d="M870 380 V200 a90 90 0 0 1 180 0 V380 Z" fill="none" stroke="#e9fdff" stroke-width="22" stroke-linejoin="round" filter="url(#soft)" opacity="0.7"/>
  <path d="M870 380 V200 a90 90 0 0 1 180 0 V380 Z" fill="url(#door)"/>
  <ellipse cx="960" cy="280" rx="70" ry="52" fill="url(#core)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3">
    <ellipse cx="960" cy="280" rx="36" ry="26"/>
    <ellipse cx="960" cy="280" rx="62" ry="45"/>
  </g>
  <path d="M870 380 V200 a90 90 0 0 1 180 0 V380 Z" fill="none" stroke="#effdff" stroke-width="12" stroke-linejoin="round"/>
  <rect x="830" y="380" width="260" height="8" rx="4" fill="#dff6ff" opacity="0.9"/>

  <!-- text -->
  <text x="88" y="190" fill="#ffffff" font-size="84" font-weight="800" letter-spacing="-2">Portal</text>
  <text x="90" y="250" fill="#cfe3ff" font-size="32" font-weight="600">Windows games &amp; apps on your Mac.</text>
  <text x="90" y="292" fill="#9fb4d8" font-size="22">Free · Native macOS app · Built on open-source Wine</text>

  <g font-size="18" font-weight="600">
    <rect x="90" y="330" width="148" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="164" y="356" fill="#e6f0ff" text-anchor="middle">Steam · Epic</text>
    <rect x="250" y="330" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="325" y="356" fill="#e6f0ff" text-anchor="middle">DirectX → Metal</text>
    <rect x="412" y="330" width="176" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="500" y="356" fill="#e6f0ff" text-anchor="middle">Apple Silicon + Intel</text>
  </g>
</svg>
